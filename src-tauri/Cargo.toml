[package]
name = "local-vtuber-studio"
version = "0.1.0"
description = "A fully local VTuber character maker"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "local_vtuber_studio"
path = "src/lib.rs"

[[bin]]
name = "local-vtuber-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
cpal = "0.18.2"
glam = { version = "0.33.6", features = ["serde"] }
gltf = "1.4.1"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.16"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
